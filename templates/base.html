<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay" aria-live="polite" aria-hidden="true">
    <div class="loading-card" role="status">
      <div class="loading-spinner" aria-hidden="true"></div>
      <div>
        <p class="loading-title" id="loading-title">Working...</p>
        <p class="loading-message" id="loading-message">Please keep this tab open.</p>
      </div>
      <div class="loading-bar" aria-hidden="true"><span></span></div>
    </div>
  </div>

  <div class="page-shell">
    <header class="app-header">
      <div>
        <h1>{{ app_name }}</h1>
      </div>
      <p class="app-summary">
        Classify YouTube songs with Azure OpenAI, review the moods, then sync private managed playlists.
      </p>
    </header>

    {% if flash %}
      <div class="flash flash-{{ flash.level }}">{{ flash.message }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
