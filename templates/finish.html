{% extends "base.html" %}
{% block content %}
  <section class="finish-layout">
    <div class="panel finish-panel">
      <div class="finish-mark" aria-hidden="true">
        <span></span>
      </div>
      <div class="section-heading">
        <h2>Categories applied</h2>
        <p>Your selected category assignments have been synced to private YouTube playlists.</p>
      </div>
      <div class="finish-actions">
        <a class="button-link" href="/preview">Start once more</a>
      </div>
      <p class="hint">Starting again reloads the playlist list from your YouTube account.</p>
    </div>
  </section>
{% endblock %}
